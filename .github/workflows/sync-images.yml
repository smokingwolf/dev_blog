name: Sync Images

on:
  push:
    branches: [main]
    paths:
      - 'source_img/**'

permissions:
  contents: write

# A newer run reconciles all image directories, so queued runs can be skipped safely.
concurrency:
  group: dev-blog-image-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror source images into published image directories
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p docs/image
          for source_dir in source_img/*/; do
            # Only mirror directories that have a matching source directory.
            # Keep independent folders such as docs/image/illust intact.
            image_dir="${source_dir#source_img/}"
            target_dir="docs/image/${image_dir}"
            mkdir -p "$target_dir"
            rsync -a --delete -- "$source_dir" "$target_dir"
          done

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/image/
          if git diff --cached --quiet; then
            echo "Image directories are already in sync"
            exit 0
          fi

          git commit -m "Auto sync added, updated and deleted images"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Image sync complete"
              exit 0
            fi
            echo "Push conflicted; rebasing onto current main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
            sleep "$attempt"
          done

          echo "Failed to push image updates after retries" >&2
          exit 1
